name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # No Supabase env: Slice 8 retired the legacy dashboard — this repo is
    # marketing-only. The service-role-leak guard below stays as a repo-wide
    # invariant.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Service-role-leak guard (D-A2 P0): the service-role / secret key must
      # never reach the client bundle. v1 needs zero service-role usage here, so
      # the strict rule is that the pattern appears NOWHERE in source.
      - name: Service-role-leak guard
        run: |
          if git grep -nE 'SUPABASE_SERVICE_ROLE_KEY|service_role|sb_secret_' -- \
                ':(glob)**/*.{ts,tsx,js,jsx,mjs,cjs,json}' \
                ':!**/*.test.*' ':!**/*.spec.*' \
             | grep -v -E '\.env'; then
            echo "::error::service-role / secret-key pattern found in source (D-A2: service-role must never reach the bundle)"
            exit 1
          fi
          echo "service-role-leak guard: clean"

      # Truth and design guards (landing v2, slice V2): key parity ES/EN, the
      # banned-word bank with per-key figure allow list, and token contrast.
      # `check:sections` runs separately until the sections comply (slice V3).
      - run: npm run check

      - run: npm run lint

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
